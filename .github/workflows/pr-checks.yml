name: PR Checks

on:
  pull_request:
    branches: [develop, main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform-checks:
    name: Terraform Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init (local backend)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  python-lint:
    name: Python Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff pytest moto boto3

      - name: Lint spending API
        run: ruff check backend/lambdas/api/spending/

      - name: Lint processor
        run: ruff check backend/lambdas/processor/

      - name: Run tests
        run: pytest backend/ -v --tb=short
        continue-on-error: true

  frontend-checks:
    name: Frontend Typecheck & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint
